openapi: 3.0.3
info:
  version: 1.0.0
  title: CONTROL-HORARIO-API
  description: API para el control horario Krono

servers:
  - description: Entorno local
    url: "http://localhost:8080/control-horario-api"

tags:
  - name: Auth
  - name: Usuarios
  - name: Perfiles
  - name: Historial

paths:
  /v1/control-horario/auth/login:
    post:
      tags:
        - Auth
      summary: Autenticacion de usuario
      description: Permite inicar sesion y obtener un token de JWT
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Credenciales inválidas

  /v1/control-horario/usuarios:
    get:
      tags:
        - Usuarios
      summary: Listar usuarios
      operationId: listarUsuarios
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsuarioResponse"

    post:
      tags:
        - Usuarios
      summary: crear usuario
      operationId: crearUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioRequest"
      responses:
        "201":
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
        "400":
          $ref: "#/components/responses/400"
        "409":
          $ref: "#/components/responses/409"

  /v1/control-horario/usuarios/{id}:
    get:
      tags:
        - Usuarios
      summary: Obtener usuario por id
      operationId: obtenerUsuario
      parameters:
        -  name: id
           in: path
           required: true
           schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRequest'     
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '404':
          description: Usuario no encontrado

    put:
      tags:
       - Usuarios
      summary: Actualizar usuario
      operationId: actualizarUsuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:  
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRequest'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
          '400':
            $ref: '#/components/responses/400'

  /v1/control-horario/perfiles:
    get:
      tags:
        - Perfiles
      summary: Listar perfiles
      operationId: listarPerfiles
      responses:
        "200":
          description: Lista de perfiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Perfil"          

  /v1/control-horario/historial:
    get:
      tags:
        - Historial
      summary: Obtener historial por correo de usuario
      operationId: obtenerHistorial
      parameters:
        - name: correo
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Historial del usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Historial"

    post:
      tags:
        - Historial
      summary: Registrar marcación
      operationId: registrarMarcacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistorialRequest"
      responses:
        "201":
          description: Marcacion registrada
        "400":
          $ref: "#/components/responses/400"
        put:
      tags:
        - Historial
      summary: Actualizar marcación de colación o salida
      description: Permite actualizar inicio colación, fin colación o salida de un historial existente
      operationId: actualizarMarcacion
      parameters:
        - name: id
          in: query
          required: true
          description: ID del historial a actualizar
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistorialUpdateRequest"

      responses:
        "200":
          description: Marcación actualizada correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Historial"
        "400":
          $ref: "#/components/responses/400"
        "404":
          description: Historial no encontrado
components:
  responses:
    "400":
      description: Error 400 - Datos inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    "409":
      description: Error 409 Conflicto de estado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    LoginRequest:
      type: object
      required: [correo, password]
       properties:
      correo:
        type: string
        format: email
      password:
        type: string
        format: password

    LoginResponse:
    type: object
    properties:
      token:
        type: string
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
      perfil:
        type: string
        example: ADMIN



  UsuarioRequest:
    type: object
    required: [nombre, correo, password, estado, perfil_id]
    properties:
      nombre:
        type: string
        example: Jose Perez
      correo:
        type: string
        format: email
        example: "jperez@correo.cl"
      password:
        type: string
        format: password
        example: "12345"
      estado:
        type: integer
        enum: [1, 2]
        example: 1
        description: "1: activo, 2: inactivo"
      perfil_id:
        type: integer
        example: 1

  UsuarioResponse:
    type: object
    properties:
      id:
        type: integer
        example: 1
      nombre:
        type: string
        example: Jose Perez
      correo:
        type: string
        format: email
        example: jperez@correo.cl
      estado:
        type: integer
        example: 1
      perfil: $ref:'#/components/schemas/Perfil'

  UsuarioUpdateRequest:
    type: object
    properties:
      nombre:
        type: string
        example: Jose Perez
      estado:
        type: integer
        enum: [1, 2]
        example: 1
        description: "1: activo, 2: inactivo"
      perfil_id:
        type: integer
        example: 2

  Perfil:
    type: object
    properties:
      perfil_id:
        type: integer
        example: 1
      nombre_perfil:
        type: string
        example: ADMIN

  HistorialUpdateRequest:
    type: object
    properties:
      inicioColacion:
        type: string
        format: time
        example: "13:00"
      finColacion:
        type: string
        format: time
        example: "14:00"
      salida:
        type: string
        format: time
        example: "18:00"

  HistorialRequest:
    type: object
    required: [correousuario, fecha, entrada]
    properties:
      correousuario:
        type: string
        format: email
      fecha:
        type: string
        format: date
      entrada:
        type: string
        format: time
      inicioColacion:
        type: string
        format: time
      finColacion:
        type: string
        format: time
      salida:
        type: string
        format: time

  Historial:
    allOf:
      - $ref: "#/components/schemas/HistorialRequest"
      - type: object
        properties:
          id:
            type: integer
            example: 10

  Error:
    type: object
    properties:
      code:
        type: string
        example: Bad Request
      level:
        type: string
        example: ERROR
      description:
        type: string
        example: Datos inválidos
